<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/basic.css">
    <style>
        :root{
            --text-color:navy;
            --bg-color:white;
        }
        body{
            background-color: var(--bg-color);
            color: var(--text-color)
        }
        /* [속성이름=속성값] */
        [dark-theme="dark"]{
            background-color: var(--text-color);
            color: var(--bg-color);
        }
    </style>
</head>
<body dark-theme="dark">
    테스토
    <div class="d-flex flex-col p-4 bg-dark text-white rounded-lg w-25 shadow-lg">
        <span class="fs-2xl fw-bold">제목</span>
        <button>버튼</button>
    </div>
</body>
</html>
