<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
<!-- 하단 스타일 태그를 채워 문제를 풀어주시면 됩니다.-->
  <style>
    .header-top{
        width: 100%;
        border: 1px solid gray;
        display: flex;
        height: 180px;
    }
    .wrap{
      margin: 0px auto;
      max-width: 1200px;
    }
    #header-top1{
      border-right: 1px solid;
      width: 20%;
    }
    #header-top2{
      border-right: 1px solid;
      border-left: 1px solid;
      width: 60%;
    }
    #header-top3{
      border-left: 1px solid;
      width: 20%;
    }
    .nav{
      width: 100%;
      border: 1px solid gray;
      margin: 5px 0px;
    }
    .nav ul{
      display: flex;
      justify-content: space-around;
    }
    .content{
      height: 450px;
      width: 100%;
      border: 1px solid gray;
      display: flex;
    }
    #content1{
      width: 26%;
      border-right: 1px solid;
    }
    #content2{
      width: 48%;
      border-left: 1px solid;
      border-right: 1px solid;
    }
    #content3{
      border-left: 1px solid;
      width: 26%;
    }
    .footer{
      width: 100%;
      margin-top: 5px;
      height: 110px;
      border: 1px solid gray;
    }
    #footer1{
      height: 75%;
      border-bottom: 1px solid;
    }
    #footer2{
      height: 25%;
      border-top: 1px solid;
    }
  </style>
</head>

<body>
  
  <div class="wrap">


    <header class="header">

      <div class="header-top">
        <div id="header-top1"></div>
        <div id="header-top2"></div>
        <div id="header-top3"></div>
      </div>

      <nav class="nav">
        <ul id="menu">
          <li>Java</li>
          <li>Oracle</li>
          <li>HTML</li>
          <li>CSS</li>
          <li>JavaScript</li>
        </ul>
      </nav>
    </header>
    <section class="content">
      <div id="content1"></div>
      <div id="content2"></div>
      <div id="content3"></div>
    </section>
    <footer class="footer">
      <div id="footer1"></div>
      <div id="footer2"></div>
    </footer>
  </div>

</body>

</html>
