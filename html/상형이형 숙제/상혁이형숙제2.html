  <style>

  /* 햄버거 메뉴 전체 영역 */
  .hamburger-menu {
    position: relative;
    width: fit-content;
  }

  /* 체크박스 숨기기 */
  #menu-toggle {
    display: none;
  }

  /* 햄버거 버튼 */
  .hamburger-button {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    width: 30px;
    height: 22px;
    cursor: pointer;
    z-index: 10;
  }


  /* 햄버거 선 */
  .hamburger-button span {
    display: block;
    width: 100%;
    height: 3px;
    background-color: #222;
    border-radius: 5px;
    transition: 0.3s;
  }

  /* 첫 번째 선을 X 모양으로 변경 */
  #menu-toggle:checked + .hamburger-button span:nth-child(1) {
    transform: translateY(9.5px) rotate(45deg);
  }

  /* 가운데 선 숨기기 */
  #menu-toggle:checked + .hamburger-button span:nth-child(2) {
    opacity: 0;
  }

  /* 세 번째 선을 X 모양으로 변경 */
  #menu-toggle:checked + .hamburger-button span:nth-child(3) {
    transform: translateY(-9.5px) rotate(-45deg);
  }

  </style>
</head>
