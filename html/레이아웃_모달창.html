<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <link rel="stylesheet" href="../css/style.css"> -->
    <style>
        /* 
            변수 선언
            --변수명 = 값;
         */
        :root{
            --white : #fff;

        }
        @import url('https://fonts.googleapis.com/css2?family=Gaegu&display=swap');
        .modal-backdrop{
            display: flex;
            background-color: rgba(0, 0, 255, 0.185);
            inset: 0;
            position: fixed;
            justify-content: center;
            align-items: center;
            
        }
        .modal-box{
            background-color: var(--white);
            width: 400px;
            padding: 20px;
            position: relative;

            border-radius: 20px;
        }
        .modal-box input{
            width: 100%;
            height: 30px;
            font-size: 1.2rem;
            padding-left: 10px;
            border: 1px solid #ccc;
            margin: 10px 0px;
        }
        
        .modal-close{
            position: absolute;
            right: 20px;
            top: 20px;

            border: none;
            background-color: beige;
            font-size: 2rem;
            color: brown;
            
        }
        .btn{

        }
        .w-100{
            width: 100%;
        }
        .bc-blue{
            background-color: yellow;
        }
        .border-none{
            border: none;
        }
        .fs-large{
            font-size: 1.2rem;
        }
        #modalTitle{
            font-family: "Gaegu", sans-serif;;
            font-weight: 600;
            font-style: normal;
            font-size: 2rem;
            /* margin: 0px; */
        }
        .show{

        }
        .h-30px{
            height: 30px;
        }
        #modalContent{
            color: #666;
            margin-bottom: 20px;
        }

        .modal-box h3, .modal-box h6{
            font-family: "Gaegu", sans-serif;;
            font-weight: 500;
            font-style: normal;
            font-size: 1rem;
            margin: 0px;
        }

    </style>
</head>
<body>
    <!-- 모달을 여는 버튼 -->
    <button id="loginTrigger">로그인</button>

    <!-- 평소엔 숨겨져 있는 백드롭 + 모달 -->
    <div class="modal-backdrop show" id="modalBackdrop">
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <button class="modal-close" id="modalClose" aria-label="닫기">&times;</button>
            <h3 id="modalTitle">로그인</h3>
            <h6 id="modalContent" >이메일과 비밀번호를 입력하세요</h6>
            <form id="loginForm">
            <!-- lable는 인라인 속성을 가지고 있어서 마진 패딩을 가질 수 없다  -->
            <label for="email" >이메일</label>
            <input type="email" id="email" required>

            <label for="password">비밀번호</label>
            <input type="password" id="password" required>

            <button type="submit" class="btn w-100 border-none h-30px fs-large bc-blue">로그인</button>
            </form>
        </div>
    </div> 


</body>
</html>
