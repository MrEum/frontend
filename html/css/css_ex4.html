<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<title>연습문제</title>
  <style>
        table{
            border: 1px black solid;
            border-collapse: collapse;
        }
        th{
            border: 1px black solid ;
            padding: 10px;
        }
        td{
            border: 1px black solid ;
            padding: 10px;
            text-align: right;
        }
        caption{
            caption-side: bottom;
            text-align: right;
        }
        .l2022{
            background-color: rgb(183, 233, 236);
            
        }

  </style>
</head>
<body>
  <table>
    <caption>출처: 통계청 100대 지표</caption>
    <thead>
      <tr>
        <th>지수</th>
        <th>2019</th>
        <th>2020</th>
        <th>2021</th>
        <th class="l2022">2022</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th>가구 수</th>
        <td>20,891,348</td>
        <td>21,484,785</td>
        <td>22,022,753</td>
        <td class="l2022">22,383,187</td>
      </tr>
      <tr>
        <th>1인 가구 수</th>
        <td>6,147,516</td>
        <td>6,643,354</td>
        <td>7,165,788</td>
        <td class="l2022">7,502,350</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
