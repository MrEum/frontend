<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 
        선택자를 이용해서 요소를 선택하고 중괄호 안에 스타일을 정의 한다.
        선택자 : 요소를 선택
                 #아이디
        선택자 {
            속성 : 값;
            속성 : 값;
            width : 30px;
            height : 20px;
        }
        
        */
        #number {
        width: 300px;
        height: 200px;
        }
        label{
                display: inline-block;
            width: 100px;
        }
    </style>
</head>
<body>
    <h1>입력양식</h1>
    <!-- 
        form : 서버에 데이터를 전달 하기 위해서 사용

        action : 요청 하려는 페이지의 주소
        method : 요청방식 (get-기본값, post)
        name : 자바스크립트로 폼을 제어하기 위해서 사용
    -->
    <form action="LoginAction.html" method="get"
        name="LoginForm" target="_self">
        id : <input type="text" name="id" minlength="4" maxlength="9"
        placeholder="아이디"><br>아이디는 4자이상 9자 이하로 작성 가능 <br>
        pw : <input type="password" name="pw" required
        placeholder="비밀번호"><br>
        
        <!--버튼의 종류-->
        <input type="button" value="로그인">
        <!--
            form태그의 action속성을 서버에 요청
            method속성에 정의된 방식으로
            (만약 지정하지 않았다면 기본값인 get방식) 
            http://127.0.0.1:5500/html/loginAction.html?id=aa&pw=bb

            프로토콜(통신규약)  http://
            ip                127.0.0.1
            port              :5500
            경로               /html/loginAction.html
            쿼리스트링         ?id=aa&pw=bb
                               name 속성의 값 = 입력필드에 입력된 값

            데이터가 넘어가지 않는경우
                name 속성이 있는지
                form 태그로 감싸져 있는지

        -->
        <input type="submit" value="서브밋">
        <input type="reset" value="리셋">
        
    </form>
    <hr>
    <h1>입력양식 종류</h1>
    <form action="LoginAction.html">
        <fieldset>
            <legend>리그오브</legend>
            <!--
            label - 폼 요소에 이름을 붙일 때 사용
            for속성을 이용해서 요소와 연결 
            for = "요소의 아이디"

            레이블을 선택하면 입력요소의 커서가 들어간다
            -->
            <label for="test">
                text=     
            </label>
            
            
           
            
            <input id="test" type="text" placeholder="텍스트"><br>
            <label for="2">password=</label>
            <input id="2" type="password" name="" id="" placeholder="비밀번호"><br>
            <label for="3">search=</label>
            <!-- 입력창에 x 버튼을 출력-->
            <input id="3"type="search" name="" id="" placeholder="서치"><br>
            <!-- http://, http:// 문자가 있는지 체크-->
              <label for="4">url=</label>
            <input id="4" type="url" name="" id="" placeholder="url"><br>
            <!-- 이메일 형식 체크-->
            <label for="5">email=</label>
            <input id="5"type="email" name="" id="" placeholder="email"><br>
            
        </fieldset>
        <hr>
        <fieldset>
            <legend>체크 라디오</legend>
            <!--
                name 속성으로 묶어주고
                선택된 value 속성의값이 서버에 전달 
                
                체크박스 - 다중선택 (name으로 묶인 그룹에서 여러개의 항목을 선택)
                라디오버튼 - 단일선택 (name으로 묶인 그룹에서 하나의 항목을 선택)
            -->checkbox= 
            <input type="checkbox" name="안녕 신기하넹" id="" value="1">축구
            <input type="checkbox" name="안녕 신기하넹" id="" value="2">농구
            <input type="checkbox" name="안녕 신기하넹" id="" value="3">야구
            <input type="checkbox" name="안녕 신기하넹" id="" value="4">배구
            <input type="checkbox" name="안녕 신기하넹" id="" value="5">구구<br>
            성별 
            <input type="radio" name="gender" value="1" id="">남
            <input type="radio" name="gender" value="1" id="">여<br>
            number<input type="number" name="number" id="number"
                     max="100" min="1" step="10">나와
        </fieldset>
        
        <!-- 
            name 속성으로 묶어주고
            선택된 value 속성의값이 서버에 전달

            체크박스 - 다중선택
            레디오 - 단일 선택
        -->


        <hr>

        submit= <input type="submit" value="가입" ><br>



    </form>
</body>
</html>
