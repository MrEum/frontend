<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        console.log(1)
        setTimeout(() => {
            // 시간이 지난후 실행될 함수 => 콜백함수
            console.log(2)

            setTimeout(() => {
               console.log(3) 
            }, 500);

        }, 1000);


        
        // 프로미스객체는 만들어지면 콜백함수를 바로 실행
        // pending(대기중)
        // resolve => fullfiled 성공적으로 처리됨
        // reject => rejected   실패(오류)로 처리됨
        let 이채영 = new Promise((resolve, reject) => {
            resolve('resolce() 호출')
            // reject('rejected() 호출') // 반환된 값이 then의 매개변수로 들어감
        })
        
        이채영
        .then((msg)=>{
            console.log('then()', msg)
        }) // --> resolve 상태일떄 실행
        .catch(e=>{
            console.log('catch()', e)
        }) // --> reject 상태일떄 실행

        // setTimeout(콜백함수, 시간)
        function delay(ms, msg){
            // setTimeout(()=>{
            //     console.log('msg',msg)
            // },ms);
            if(ms < 0){
                throw new Error('시간은 음수로 입력 불가')
            }
            return new Promise((resolve, reject)=>{
                setTimeout(()=>{
                    console.log('msg',msg)
                    resolve(`${msg} 재헌`);
                }, ms)
            })
        }

        let 재헌 = delay(1000, '재헌 맥주')
        재헌.then((res)=>{
            console.log('res', res);
            return delay(500, '재헌 제헌')
        })
        .then((res)=>{
            delay(1000, '헌재')
        })
        .catch(e =>{
            console.log(e);
            console.log('😁오류레요~')
        });

        // async/await 이용하기
        async function init(){
            let box = document.querySelector('.재헌')
           let res = await fetch('http://api.koreafilm.or.kr/openapi-data2/wisenut/search_api/search_json2.jsp?collection=kmdb_new2&detail=Y&actor=%ED%95%9C%EC%A7%80%EB%AF%BC&ServiceKey=11M1LX721SFQ42K7AQ6R')
           console.log("fetch", res);
           let json = await res.json()
           
           console.log("json", json);
           console.log(json.Data[0].Result)
           let result = json.Data[0].Result
           console.log('box', box)
           result.forEach(item => {
                box.innerHTML += `<p>${item.title}</p>`
            
           });
        }

        window.addEventListener('load',()=>{
            init()

        })
    </script>
</head>
<body>
    <div class="재헌"></div>
</body>
</html>
