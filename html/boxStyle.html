<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color: brown;
            border: 4px solid blue;
            width: 100px;
            height: 100px;
            padding: 0 30px;/*상하 좌우*/
            margin: 10px 20px 30px 40px;/*상 우 하 좌*/
            
        }
        .box2{
            box-sizing: border-box;
            width: 100px;
            height: 100px;
            background-color: aquamarine;
            border: 10px solid red;
            box-shadow: 10px 10px 10px 10px black;
            border-radius: 50%;        

            text-align: center;
            line-height: 70px;
        }
        .circle{
            border-radius: 50%;
            
        }
        .banner{
            background-color: aquamarine;
            display: flex;
            justify-content: space-between;

        }
        .boxitem{
            width: 300px;
            height: 200px;
            background-color: brown;
            border: 2px solid;

            /* display: inline-block; */
            border-radius: 20%;
        }
        
    </style>
</head>
<body>
    <div class="box">박스</div>

    <div class="circle box2" src="https://i.namu.wiki/i/cgOZ9WurlfL047sKfG5u_W47JbT_Wr3nOzyTtip9jKEPxeC6jqLyqRLy_nW5syo5AkwblnZcLPSqcs4pFBUX2g.webp">봑스2</div>

    
    <div class="banner">
        <div class="boxitem">1</div>
        <div class="boxitem">2</div>
        <div class="boxitem">3</div>
        <div class="boxitem">4</div>
    </div>

</body>
</html>
