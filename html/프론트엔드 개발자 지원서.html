<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프론트엔드 개발자 지원서</title>
    
</head>
<body>
    <h1>프런트엔드 개발자 지원서</h1>

    <p>HTML, CSS, Javascript에 대한 기술적 이해와 경험이 있는 분을 찾습니다.</p>

    <hr>
    <!--
        action : 요청할 페이지 주소
                 비어 있는경우 자기자신을 다시 요청
    -->
    <form action="">
    <p><b>개인정보</b></p>
    <ul>
        <li>이름 <input type="text" placeholder="공백없이 입력하세요" name="이름"> </li>
        <li>연락처 <input type="tel" name="연락처" id=""></li>
    </ul> 
    
     
    <p><b>지원 분야</b></p>
    <ul>
        <li><input type="radio" name="feild" id="" value="퍼블">웹 퍼블리싱</li>
        <li><input type="radio" name="feild" id="" value="애플">웹 애플리케이션 개발</li>
        <li><input type="radio" name="feild" id="" value="개발">개발 환경 개선</li>
    </ul>
     
     
     
    <p><b>지원동기</b></p>
    <textarea cols="60" rows="5" id="" placeholder="본사 지원 동기를 간략히 써 주세요. "></textarea>
    <br>
    <button type="submit" value="">접수</button>
    <button type="reset" value="">다시</button>
    </form>
</body>
</html>
